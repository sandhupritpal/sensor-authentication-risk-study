[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-auth-risk-study"
version = "1.0.0"
description = "Analyzing side-channel biometric leakage and re-identification risks from IMU sensor telemetry in consumer wearables & XR headsets"
authors = [{ name = "Pritpal Sandhu" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "streamlit>=1.28.0",
    "joblib>=1.2.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
